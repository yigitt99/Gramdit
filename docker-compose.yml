
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: gramdit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gramdit
      POSTGRES_PASSWORD: gramdit_password
      POSTGRES_DB: gramdit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gramdit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gramdit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gramdit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gramdit-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gramdit-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: gramdit
      DB_PASSWORD: gramdit_password
      DB_DATABASE: gramdit_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      API_PREFIX: /api/v1
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gramdit-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gramdit-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_API_TIMEOUT: 10000
      VITE_APP_NAME: Gramdit
      VITE_APP_VERSION: 1.0.0
    depends_on:
      - backend
    networks:
      - gramdit-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  gramdit-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
